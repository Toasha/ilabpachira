name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: 'pages'
  cancel-in-progress: true

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build project with Vite
        env:
          VITE_GAS_API_URL: ${{ secrets.VITE_GAS_API_URL || 'https://script.google.com/macros/s/AKfycbz5YgmLc-IQPS_bD-onLyz6No-i4rTts64PR0T3mASLeWhPyrVWhLXXi5E6Au4c9Y0pzQ/exec' }}
        run: npm run build

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload dist artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Send Discord notification
        if: always()
        env:
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "DISCORD_WEBHOOK secret is not set. Skipping notification."
            exit 0
          fi

          if [ "${{ job.status }}" = "success" ]; then
            COLOR=3066993
            TITLE="✅ GitHub Pages デプロイ完了"
            DESC="🌱 **パキラの水やり記録** の最新版が正常に公開されました！\n\n**公開URL**: ${{ steps.deployment.outputs.page_url }}"
          else
            COLOR=15158332
            TITLE="❌ GitHub Pages デプロイ失敗"
            DESC="⚠️ デプロイビルドでエラーが発生しました。"
          fi

          curl -H "Content-Type: application/json" \
               -X POST \
               -d '{
                 "embeds": [{
                   "title": "'"$TITLE"'",
                   "description": "'"$DESC"'",
                   "url": "${{ steps.deployment.outputs.page_url }}",
                   "color": '"$COLOR"',
                   "fields": [
                     {
                       "name": "コミットメッセージ",
                       "value": "${{ github.event.head_commit.message }}"
                     },
                     {
                       "name": "ブランチ",
                       "value": "`${{ github.ref_name }}`",
                       "inline": true
                     }
                   ],
                   "footer": {
                     "text": "GitHub Actions • パキラの水やり記録"
                   }
                 }]
               }' \
               "$DISCORD_WEBHOOK"

